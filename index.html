<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A&R Towing LLC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
    }

    .hero {
      height: 100vh;
      background: url('/truck.png') no-repeat center center/cover;
      position: relative;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      top: 50%;
      transform: translateY(-50%);
    }

    .logo {
      width: 180px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 48px;
      margin: 0;
    }

    p {
      font-size: 20px;
      margin: 10px 0 20px;
    }

    .btn {
      background: red;
      color: white;
      padding: 15px 25px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
    }

    .section {
      padding: 60px 20px;
      text-align: center;
      background: #111;
    }
  </style>
</head>

<body>

  <!-- HERO SECTION -->
  <div class="hero">
    <div class="overlay"></div>

    <div class="content">
      <img src="/logo.jpg" class="logo" alt="A&R Towing Logo">

      <h1>A&R TOWING LLC</h1>
      <p>Fast • Reliable • 24/7 Towing & Roadside Assistance</p>
      <p>Northern Virginia & DMV Area</p>

      <a href="#" class="btn">Request Service</a>
    </div>
  </div>

  <!-- SERVICES -->
  <div class="section">
    <h2>Our Services</h2>
    <p>Flatbed Towing • Roadside Assistance • Vehicle Transport</p>
  </div>

  <!-- ABOUT -->
  <div class="section">
    <h2>Why Choose Us?</h2>
    <p>Professional service, fast response times, and reliable equipment you can trust.</p>
  </div>

</body>
</html>
